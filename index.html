<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校務資料綜合查詢系統 - 招生名額與註冊率</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js DataLabels Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

  <!-- ================= 主系統頁面 ================= -->
  <div class="max-w-7xl mx-auto space-y-6 py-8 px-4">
    
    <!-- 頂部頁頭 -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1">校務分析查詢系統</h1>
      <p class="text-xs sm:text-sm text-slate-500">提供各學年度招生名額核定數與系所新生註冊率資料查詢</p>
    </div>

    <!-- 分頁導覽按鈕 (Tabs Header) -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-3 gap-2">
      <button id="tabBtnQuota" onclick="switchTab('quota')" class="py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-blue-600 text-blue-600">
        📊 招生名額查詢
      </button>
      <button id="tabBtnEnroll" onclick="switchTab('enroll')" class="py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-transparent text-slate-500 hover:text-slate-700">
        🎓 新生註冊率查詢
      </button>
    </div>

    <!-- ================= Tab 1: 招生名額內容 ================= -->
    <div id="tabQuotaContent" class="space-y-6">
      <div class="bg-white p-6 rounded-b-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-700">🔍 名額資料篩選器</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">名額類別</label>
            <select id="qFilterType" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部類別</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">學年度</label>
            <select id="qFilterYear" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部學年度</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">學制</label>
            <select id="qFilterSystem" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部學制</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">領域別</label>
            <select id="qFilterDomain" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部領域</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">系所關鍵字</label>
            <input type="text" id="qSearchInput" placeholder="輸入系所名稱..." class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- 名額統計數據 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-blue-600 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">總名額計</div>
          <div id="qStatTotal" class="text-3xl font-extrabold">0</div>
        </div>
        <div class="bg-slate-800 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">符合資料筆數</div>
          <div id="qStatRows" class="text-3xl font-extrabold">0</div>
        </div>
        <div class="bg-teal-600 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">涵蓋系所數</div>
          <div id="qStatDepts" class="text-3xl font-extrabold">0</div>
        </div>
      </div>

      <!-- 名額圖表 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700">📈 歷年招生名額趨勢</h2>
        <div class="relative h-64 sm:h-80"><canvas id="quotaChart"></canvas></div>
      </div>

      <!-- 名額表格 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
          <span>📋 招生名額明細清單</span>
          <span id="qTableInfo" class="text-xs text-slate-500"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left text-slate-600">
            <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
              <tr>
                <th class="px-4 py-3">學年度</th>
                <th class="px-4 py-3">名額類別</th>
                <th class="px-4 py-3">開設系所名稱</th>
                <th class="px-4 py-3">學制</th>
                <th class="px-4 py-3 text-right">名額</th>
                <th class="px-4 py-3">領域別</th>
              </tr>
            </thead>
            <tbody id="qTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ================= Tab 2: 新生註冊率內容 ================= -->
    <div id="tabEnrollContent" class="space-y-6 hidden">
      <div class="bg-white p-6 rounded-b-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="text-lg font-bold text-slate-700">🔍 註冊率資料篩選器</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">學年度</label>
            <select id="eFilterYear" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部學年度</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">日間 / 進修</label>
            <select id="eFilterDayNight" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部類別</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">學制班別</label>
            <select id="eFilterClass" class="w-full p-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-2 focus:ring-blue-500">
              <option value="">全部班別</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">系所關鍵字搜尋</label>
            <input type="text" id="eSearchInput" placeholder="搜尋系所名稱..." class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </div>

      <!-- 註冊率統計數據卡 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-indigo-600 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">篩選條件平均註冊率</div>
          <div id="eStatAvgRate" class="text-3xl font-extrabold">0%</div>
        </div>
        <div class="bg-emerald-600 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">總實際註冊人數 (C+E)</div>
          <div id="eStatTotalReg" class="text-3xl font-extrabold">0</div>
        </div>
        <div class="bg-slate-700 text-white p-5 rounded-xl shadow-sm">
          <div class="text-xs opacity-80 mb-1">總核定招生名額 (A)</div>
          <div id="eStatTotalQuota" class="text-3xl font-extrabold">0</div>
        </div>
      </div>

      <!-- 註冊率趨勢圖表 -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold mb-4 text-slate-700">📉 歷年平均註冊率變化 ( % )</h2>
        <div class="relative h-64 sm:h-80"><canvas id="enrollChart"></canvas></div>
      </div>

      <!-- 註冊率資料表格 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-200 font-bold text-slate-700 flex justify-between items-center">
          <span>📋 系所新生註冊率詳細明細</span>
          <span id="eTableInfo" class="text-xs text-slate-500"></span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left text-slate-600">
            <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
              <tr>
                <th class="px-3 py-3">學年度</th>
                <th class="px-3 py-3">系所名稱</th>
                <th class="px-3 py-3">日間/進修</th>
                <th class="px-3 py-3">學制班別</th>
                <th class="px-3 py-3 text-right">核定名額(A)</th>
                <th class="px-3 py-3 text-right">保留資格(B)</th>
                <th class="px-3 py-3 text-right">實際註冊(C)</th>
                <th class="px-3 py-3 text-right">境外註冊(E)</th>
                <th class="px-3 py-3 text-right">新生註冊率 (%)</th>
              </tr>
            </thead>
            <tbody id="eTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    Chart.register(ChartDataLabels);

    let quotaRawData = [];
    let enrollRawData = [];
    let qChartObj = null;
    let eChartObj = null;

    // 頁面載入完成後直接讀取資料
    window.addEventListener('DOMContentLoaded', () => {
      loadAllData();
    });

    // --- 1. 分頁切換邏輯 ---
    function switchTab(tab) {
      const btnQuota = document.getElementById('tabBtnQuota');
      const btnEnroll = document.getElementById('tabBtnEnroll');
      const contentQuota = document.getElementById('tabQuotaContent');
      const contentEnroll = document.getElementById('tabEnrollContent');

      if (tab === 'quota') {
        btnQuota.className = 'py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-blue-600 text-blue-600';
        btnEnroll.className = 'py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-transparent text-slate-500 hover:text-slate-700';
        contentQuota.classList.remove('hidden');
        contentEnroll.classList.add('hidden');
      } else {
        btnEnroll.className = 'py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-indigo-600 text-indigo-600';
        btnQuota.className = 'py-3 px-6 text-sm font-bold border-b-2 transition-all flex items-center gap-2 border-transparent text-slate-500 hover:text-slate-700';
        contentEnroll.classList.remove('hidden');
        contentQuota.classList.add('hidden');
      }
    }

    // --- 2. 資料載入 (Promise.all 同步載入雙檔) ---
    function loadAllData() {
      Promise.all([
        new Promise(res => Papa.parse('data.csv', { download: true, header: true, complete: res })),
        new Promise(res => Papa.parse('enrollment.csv', { download: true, header: true, complete: res }))
      ]).then(([quotaRes, enrollRes]) => {
        // 解析名額資料
        quotaRawData = quotaRes.data.map(r => ({
          year: (r['學年度'] || '').toString().trim(),
          type: (r['名額類別'] || r['類別'] || '').toString().trim(),
          dept: (r['開設系所名稱'] || '').toString().trim(),
          system: (r['學制'] || '').toString().trim(),
          quota: parseInt(r['名額'] || '0', 10),
          domain: (r['領域別'] || '').toString().trim()
        })).filter(r => r.year && r.dept);

        // 解析註冊率資料
        enrollRawData = enrollRes.data.map(r => ({
          year: (r['學年度'] || '').toString().trim(),
          dept: (r['系所名稱'] || '').toString().trim(),
          dayNight: (r['日間/進修'] || '').toString().trim(),
          systemClass: (r['學制班別'] || '').toString().trim(),
          quotaA: parseInt(r['總量內核定招生名額(A)'] || '0', 10),
          reserveB: parseInt(r['新生保留入學資格人數(B)'] || '0', 10),
          regC: parseInt(r['總量內招生核定名額之實際註冊人數(C)'] || '0', 10),
          overseaE: parseInt(r['境外(新生)學生實際註冊人數 (E)'] || '0', 10),
          rate: parseFloat(r['新生註冊率(%)D=〔(C+E)/(A-B+E)〕 * 100%'] || r['新生註冊率(%)'] || 0)
        })).filter(r => r.year && r.dept);

        initQuotaControls();
        initEnrollControls();
        updateQuotaView();
        updateEnrollView();
      }).catch(err => {
        console.error('資料載入錯誤:', err);
      });
    }

    // --- 3. 名額 Tab 邏輯 ---
    function initQuotaControls() {
      populateSelect('qFilterType', [...new Set(quotaRawData.map(d => d.type))].sort());
      populateSelect('qFilterYear', [...new Set(quotaRawData.map(d => d.year))].sort((a,b)=>a-b));
      populateSelect('qFilterSystem', [...new Set(quotaRawData.map(d => d.system))].sort());
      populateSelect('qFilterDomain', [...new Set(quotaRawData.map(d => d.domain))].sort());

      ['qFilterType', 'qFilterYear', 'qFilterSystem', 'qFilterDomain'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateQuotaView);
      });
      document.getElementById('qSearchInput').addEventListener('input', updateQuotaView);
    }

    function updateQuotaView() {
      const type = document.getElementById('qFilterType').value;
      const year = document.getElementById('qFilterYear').value;
      const sys = document.getElementById('qFilterSystem').value;
      const domain = document.getElementById('qFilterDomain').value;
      const kw = document.getElementById('qSearchInput').value.toLowerCase().trim();

      const filtered = quotaRawData.filter(r => {
        return (!type || r.type === type) &&
               (!year || r.year === year) &&
               (!sys || r.system === sys) &&
               (!domain || r.domain === domain) &&
               (!kw || r.dept.toLowerCase().includes(kw));
      });

      const totalQuota = filtered.reduce((s, r) => s + r.quota, 0);
      document.getElementById('qStatTotal').textContent = totalQuota.toLocaleString();
      document.getElementById('qStatRows').textContent = filtered.length.toLocaleString();
      document.getElementById('qStatDepts').textContent = new Set(filtered.map(r => r.dept)).size;
      document.getElementById('qTableInfo').textContent = `顯示 ${filtered.length} 筆資料`;

      const tbody = document.getElementById('qTableBody');
      tbody.innerHTML = filtered.map(r => `
        <tr class="border-b border-slate-100 hover:bg-slate-50">
          <td class="px-4 py-3 font-semibold text-slate-800">${r.year}</td>
          <td class="px-4 py-3"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-blue-100 text-blue-800">${r.type}</span></td>
          <td class="px-4 py-3 text-blue-700 font-medium">${r.dept}</td>
          <td class="px-4 py-3">${r.system}</td>
          <td class="px-4 py-3 text-right font-bold">${r.quota}</td>
          <td class="px-4 py-3 text-slate-500">${r.domain}</td>
        </tr>
      `).join('');

      renderQuotaChart(filtered);
    }

    function renderQuotaChart(data) {
      const yearMap = {};
      data.forEach(r => yearMap[r.year] = (yearMap[r.year] || 0) + r.quota);
      const years = Object.keys(yearMap).sort((a,b)=>a-b);
      const values = years.map(y => yearMap[y]);

      const ctx = document.getElementById('quotaChart').getContext('2d');
      if (qChartObj) qChartObj.destroy();
      qChartObj = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: years.map(y => `${y} 學年度`),
          datasets: [{ label: '招生名額', data: values, backgroundColor: 'rgba(59, 130, 246, 0.85)', borderRadius: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }

    // --- 4. 註冊率 Tab 邏輯 ---
    function initEnrollControls() {
      populateSelect('eFilterYear', [...new Set(enrollRawData.map(d => d.year))].sort((a,b)=>a-b));
      populateSelect('eFilterDayNight', [...new Set(enrollRawData.map(d => d.dayNight))].sort());
      populateSelect('eFilterClass', [...new Set(enrollRawData.map(d => d.systemClass))].sort());

      ['eFilterYear', 'eFilterDayNight', 'eFilterClass'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateEnrollView);
      });
      document.getElementById('eSearchInput').addEventListener('input', updateEnrollView);
    }

    function updateEnrollView() {
      const year = document.getElementById('eFilterYear').value;
      const dn = document.getElementById('eFilterDayNight').value;
      const cls = document.getElementById('eFilterClass').value;
      const kw = document.getElementById('eSearchInput').value.toLowerCase().trim();

      const filtered = enrollRawData.filter(r => {
        return (!year || r.year === year) &&
               (!dn || r.dayNight === dn) &&
               (!cls || r.systemClass === cls) &&
               (!kw || r.dept.toLowerCase().includes(kw));
      });

      const totalA = filtered.reduce((s, r) => s + r.quotaA, 0);
      const totalReg = filtered.reduce((s, r) => s + r.regC + r.overseaE, 0);
      const avgRate = filtered.length > 0 ? (filtered.reduce((s, r) => s + r.rate, 0) / filtered.length).toFixed(2) : 0;

      document.getElementById('eStatAvgRate').textContent = `${avgRate}%`;
      document.getElementById('eStatTotalReg').textContent = totalReg.toLocaleString();
      document.getElementById('eStatTotalQuota').textContent = totalA.toLocaleString();
      document.getElementById('eTableInfo').textContent = `顯示 ${filtered.length} 筆資料`;

      const tbody = document.getElementById('eTableBody');
      tbody.innerHTML = filtered.map(r => {
        const rateColor = r.rate >= 80 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800';
        return `
          <tr class="border-b border-slate-100 hover:bg-slate-50">
            <td class="px-3 py-3 font-semibold text-slate-800">${r.year}</td>
            <td class="px-3 py-3 font-medium text-indigo-700">${r.dept}</td>
            <td class="px-3 py-3">${r.dayNight}</td>
            <td class="px-3 py-3">${r.systemClass}</td>
            <td class="px-3 py-3 text-right font-medium">${r.quotaA}</td>
            <td class="px-3 py-3 text-right text-slate-500">${r.reserveB}</td>
            <td class="px-3 py-3 text-right text-slate-700 font-semibold">${r.regC}</td>
            <td class="px-3 py-3 text-right text-slate-700 font-semibold">${r.overseaE}</td>
            <td class="px-3 py-3 text-right">
              <span class="px-2 py-1 rounded text-xs font-extrabold ${rateColor}">${r.rate.toFixed(2)}%</span>
            </td>
          </tr>
        `;
      }).join('');

      renderEnrollChart(filtered);
    }

    function renderEnrollChart(data) {
      const yearMap = {};
      data.forEach(r => {
        if (!yearMap[r.year]) yearMap[r.year] = { sum: 0, count: 0 };
        yearMap[r.year].sum += r.rate;
        yearMap[r.year].count += 1;
      });

      const years = Object.keys(yearMap).sort((a,b)=>a-b);
      const avgRates = years.map(y => (yearMap[y].sum / yearMap[y].count).toFixed(2));

      const ctx = document.getElementById('enrollChart').getContext('2d');
      if (eChartObj) eChartObj.destroy();
      eChartObj = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years.map(y => `${y} 學年度`),
          datasets: [{
            label: '平均註冊率 (%)',
            data: avgRates,
            borderColor: 'rgba(79, 70, 229, 1)',
            backgroundColor: 'rgba(79, 70, 229, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 100 } }
        }
      });
    }

    function populateSelect(elemId, options) {
      const sel = document.getElementById(elemId);
      const defaultOpt = sel.options[0];
      sel.innerHTML = '';
      sel.appendChild(defaultOpt);
      options.forEach(opt => {
        if (!opt) return;
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        sel.appendChild(o);
      });
    }
  </script>
</body>
</html>
